name: Build

# CI build: builds ParrotRelay on Windows for every push and pull
# request and attaches the zip to the run, so a change can be tried
# out before it is released.
#
# Releases are NOT made here - that is the "Build new Release"
# workflow (release.yml), started by hand from the Actions tab.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # PyInstaller can't cross-compile, so a Windows runner is required.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        run: pyinstaller --noconfirm --clean ParrotRelay.spec

      - name: Stage package contents
        shell: pwsh
        run: |
          # dist\ParrotRelay already has the wanted layout:
          #   ParrotRelay.exe  +  RelayData\ (runtime files)
          # Add the docs on top so the zip is self-contained.
          Copy-Item README.md, LICENSE dist\ParrotRelay\

      - name: Create zip
        id: package
        shell: pwsh
        run: |
          $name = "ParrotRelay-$(git rev-parse --short HEAD)"
          # The folder itself, not its contents: unpacking into the
          # TeknoParrot folder then yields TeknoParrot\ParrotRelay\...
          Compress-Archive -Path dist\ParrotRelay -DestinationPath "$name.zip"
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.zip
          if-no-files-found: error
