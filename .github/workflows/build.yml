name: Build

# Builds ParrotRelay on Windows and packs the complete onedir output
# (ParrotRelay.exe + the ParrotRelay folder with the runtime files)
# into a single zip.
#
#   - every push/PR: the zip is attached to the run as an artifact
#   - a pushed tag (v1.2.3): the zip is also attached to a release
#   - "Run workflow" in the Actions tab builds on demand

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # PyInstaller can't cross-compile, so a Windows runner is required.
    runs-on: windows-latest
    permissions:
      # Needed only by the release step on a tag build.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        run: pyinstaller --noconfirm --clean ParrotRelay.spec

      - name: Stage package contents
        shell: pwsh
        run: |
          # dist\ParrotRelay already has the wanted layout:
          #   ParrotRelay.exe  +  ParrotRelay\ (runtime files)
          # Add the docs on top so the zip is self-contained.
          Copy-Item README.md, LICENSE dist\ParrotRelay\
          Get-ChildItem -Recurse dist\ParrotRelay | Select-Object FullName

      - name: Determine package name
        id: name
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -like "refs/tags/*") {
            $version = $ref -replace "^refs/tags/", ""
          } else {
            $version = "$(git rev-parse --short HEAD)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "package=ParrotRelay-$version" >> $env:GITHUB_OUTPUT

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\ParrotRelay\* `
            -DestinationPath "${{ steps.name.outputs.package }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.package }}
          path: ${{ steps.name.outputs.package }}.zip
          if-no-files-found: error

      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.name.outputs.version }}" `
            "${{ steps.name.outputs.package }}.zip" `
            --title "${{ steps.name.outputs.version }}" `
            --generate-notes `
            --repo "${{ github.repository }}"
